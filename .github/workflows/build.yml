name: Build NativeAOT

on:
  release:
    types: [created]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: ClaudeChatManager.exe
          - os: macos-14
            rid: osx-arm64
            artifact: ClaudeChatManager
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish chat-manager-gui/ClaudeChatManager/ClaudeChatManager.csproj -c Release -r ${{ matrix.rid }} -o chat-manager-gui/publish

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path chat-manager-gui/publish/${{ matrix.artifact }} -DestinationPath chat-manager-gui/publish/ClaudeChatManager-${{ matrix.rid }}.zip

      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: cd chat-manager-gui/publish && zip ClaudeChatManager-${{ matrix.rid }}.zip ${{ matrix.artifact }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: chat-manager-gui/publish/ClaudeChatManager-${{ matrix.rid }}.zip
